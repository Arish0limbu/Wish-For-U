<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just for You</title>
    <link rel="stylesheet" href="css/lock.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="lock-screen">
        <div class="heart-lock-icon">
            <img src="images/hearts/heart-lock.png" alt="Heart Lock">
        </div>

        <h1 class="title">Just for You</h1>
        <div class="underline"></div>

        <p class="subtitle">This special place is locked with a secret...</p>

        <div class="pin-display">
            <div class="pin-dot" data-index="0"></div>
            <div class="pin-dot" data-index="1"></div>
            <div class="pin-dot" data-index="2"></div>
            <div class="pin-dot" data-index="3"></div>
        </div>

        <p class="instruction">Enter the correct PIN to continue</p>

        <div class="keypad">
            <button class="key" data-number="1">1</button>
            <button class="key" data-number="2">2</button>
            <button class="key" data-number="3">3</button>
            <button class="key" data-number="4">4</button>
            <button class="key" data-number="5">5</button>
            <button class="key" data-number="6">6</button>
            <button class="key" data-number="7">7</button>
            <button class="key" data-number="8">8</button>
            <button class="key" data-number="9">9</button>
            <button class="key clear-btn" data-action="clear">✕</button>
            <button class="key" data-number="0">0</button>
            <button class="key backspace-btn" data-action="backspace">⌫</button>
        </div>

        <p class="footer-text">Good things take a little time...</p>
    </div>

    <script src="js/lock.js"></script>
</body>
</html>
